<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">jisuzzzz profile banner</title>
  <desc id="desc">A dark gradient banner introducing jisuzzzz as a product-minded frontend developer.</desc>
  <defs>
    <linearGradient id="bg" x1="58" y1="20" x2="1140" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090E1A"/>
      <stop offset="0.48" stop-color="#11112A"/>
      <stop offset="1" stop-color="#071B27"/>
    </linearGradient>
    <linearGradient id="accent" x1="326" y1="86" x2="876" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(215 56) rotate(28) scale(390 250)">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 280) rotate(-155) scale(430 255)">
      <stop stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#violetGlow)"/>
    <rect width="1200" height="320" fill="url(#cyanGlow)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <path d="M-80 268C176 176 340 332 594 230C808 144 959 56 1290 104" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.62"/>
    <path d="M-50 290C190 208 362 352 610 254C842 162 982 92 1265 126" stroke="url(#accent)" stroke-opacity="0.23"/>

    <circle cx="1070" cy="70" r="62" stroke="#22D3EE" stroke-opacity="0.16"/>
    <circle cx="1070" cy="70" r="42" stroke="#A78BFA" stroke-opacity="0.22"/>
    <circle cx="1070" cy="70" r="5" fill="#22D3EE" filter="url(#softGlow)"/>

    <g transform="translate(72 53)">
      <rect width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.065" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="18" cy="15" r="4" fill="#34D399"/>
      <text x="31" y="20" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">AVAILABLE</text>
    </g>

    <text x="68" y="168" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">JISUZZZZ</text>
    <text x="72" y="207" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4">PRODUCT-MINDED FRONTEND DEVELOPER</text>
    <text x="72" y="244" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" letter-spacing="0.8">Building useful things with code + curiosity.</text>

    <g fill="#FFFFFF" fill-opacity="0.3">
      <circle cx="1122" cy="254" r="2"/>
      <circle cx="1152" cy="254" r="2"/>
      <circle cx="1092" cy="254" r="2"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="27.25" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
